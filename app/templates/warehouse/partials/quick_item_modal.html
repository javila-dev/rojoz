<dialog id="quick-create-dialog" class="modal" open>
    <div class="modal-box max-w-3xl max-h-[90vh] overflow-y-auto">
        <h3 class="font-bold text-lg">Nuevo ítem</h3>
        <p class="text-sm text-gray-500 mt-1">Mismos datos que en el catálogo; al guardar se usa en esta factura.</p>
        <form
            class="mt-4"
            enctype="multipart/form-data"
            hx-post="{% url 'warehouse:purchase_quick_item' %}"
            hx-target="#quick-create-modal-root"
            hx-swap="innerHTML"
            hx-encoding="multipart/form-data"
        >
            {% csrf_token %}
            {% if line_index != "" and line_index is not None %}
            <input type="hidden" name="line_index" value="{{ line_index }}">
            {% endif %}
            {% if form.non_field_errors %}
            <div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700">{{ form.non_field_errors }}</div>
            {% endif %}
            {% include "warehouse/partials/item_form_fields.html" %}
            <div class="modal-action sticky bottom-0 bg-white pt-4 border-t border-gray-100 mt-6">
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('quick-create-dialog')?.close(); document.getElementById('quick-create-modal-root').innerHTML='';">Cancelar</button>
                <button type="submit" class="btn btn-primary">Crear y usar</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop" onclick="document.getElementById('quick-create-modal-root').innerHTML=''">
        <button>close</button>
    </form>
</dialog>
