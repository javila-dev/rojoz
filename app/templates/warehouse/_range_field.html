{# Expects: field (Django BoundField with type=range) #}
<div class="wh-range {% if full %}md:col-span-2{% endif %}" data-range-wrap>
    <div class="flex items-baseline justify-between gap-2 mb-1">
        <label class="label py-0" for="{{ field.id_for_label }}">
            <span class="label-text text-sm font-medium text-gray-700">
                {{ field.label }}{% if field.field.required %}<span class="text-rojoz-500"> *</span>{% endif %}
            </span>
        </label>
        <span class="text-sm font-semibold tabular-nums text-gray-800" data-range-value>
            {{ field.value|default_if_none:field.field.initial }}
        </span>
    </div>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-gray-500">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}
    <p class="mt-1 text-sm text-red-600 flex items-center gap-1"><i class="ri-alert-line"></i> {{ field.errors.0 }}</p>
    {% endif %}
</div>
