{% comment %}
Campos comunes del filtro de documentos de bodega (va dentro del <form method="get">).
Contexto: statuses, estado, warehouses, bodega, desde, hasta (lo arma _document_filters).
{% endcomment %}
<label class="sr-only" for="filter-estado">Estado</label>
<select id="filter-estado" name="estado" class="select select-bordered select-sm md:w-40" onchange="this.form.submit()">
    <option value="">Todos los estados</option>
    {% for value, label in statuses %}
    <option value="{{ value }}"{% if estado == value %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
</select>
{% if warehouses|length > 1 or bodega %}
<label class="sr-only" for="filter-bodega">Bodega</label>
<select id="filter-bodega" name="bodega" class="select select-bordered select-sm md:w-48" onchange="this.form.submit()">
    <option value="">Todas las bodegas</option>
    {% for w in warehouses %}
    <option value="{{ w.pk }}"{% if bodega == w.pk %} selected{% endif %}>{{ w.code }} · {{ w.name }}</option>
    {% endfor %}
</select>
{% endif %}
<div class="flex items-center gap-1.5 w-full md:w-auto">
    <label for="filter-desde" class="text-xs text-gray-500">Desde</label>
    <input id="filter-desde" type="date" name="desde" value="{{ desde|date:'Y-m-d' }}" class="input input-bordered input-sm min-w-0 flex-1 md:flex-none md:w-36">
    <label for="filter-hasta" class="text-xs text-gray-500">Hasta</label>
    <input id="filter-hasta" type="date" name="hasta" value="{{ hasta|date:'Y-m-d' }}" class="input input-bordered input-sm min-w-0 flex-1 md:flex-none md:w-36">
</div>
